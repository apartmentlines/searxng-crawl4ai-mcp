# SearXNG + Crawl4AI MCP - Truly Self-Hosted Search & Scrape Stack

services:
  # SearXNG - Open source metasearch engine
  searxng:
    build:
      context: ./docker/searxng
      dockerfile: Dockerfile
    image: searxng-crawl4ai/searxng:custom
    container_name: searxng
    ports:
      - "8081:8080"
    environment:
      - SEARXNG_BASE_URL=http://localhost:8081/
      - SEARXNG_SECRET=${SEARXNG_SECRET}
      - SEARXNG_PROXY_USER=${SEARXNG_PROXY_USER}
      - SEARXNG_PROXY_PASSWORD_URLENCODED=${SEARXNG_PROXY_PASSWORD_URLENCODED}
    volumes:
      - ./settings.yml.template:/etc/searxng/settings.yml.template:ro
      - ${MCP_METRICS_DATA_DIR:-./data}/container-runs:/mcp-run-state
    post_start:
      - command: >
          /bin/sh -c 'run_id="$$(cat /proc/sys/kernel/random/uuid)";
          started_at="$$(date -u +%Y-%m-%dT%H:%M:%SZ)";
          tmp=/mcp-run-state/searxng.json.tmp;
          printf "{\"service\":\"searxng\",\"run_id\":\"%s\",\"started_at\":\"%s\"}\n" "$$run_id" "$$started_at" > "$$tmp";
          mv "$$tmp" /mcp-run-state/searxng.json'
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    networks:
      - search-net
    restart: unless-stopped
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8080/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis for caching
  redis:
    image: redis:alpine
    command: redis-server --save 30 1 --loglevel warning
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - search-net
    restart: unless-stopped
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 3s
      retries: 3

  # Crawl4AI service for web scraping
  crawl4ai:
    build:
      context: .
      dockerfile: Dockerfile.crawl4ai
    container_name: crawl4ai
    ports:
      - "8001:8000"
    environment:
      - PROXY_URL=${PROXY_URL}
      - CRAWL4AI_LOG_LEVEL=INFO
      - CRAWL4AI_SCRAPE_TIMEOUT_MS=${CRAWL4AI_SCRAPE_TIMEOUT_MS:-10000}
      - CRAWL4AI_BATCH_TIMEOUT_MS=${CRAWL4AI_BATCH_TIMEOUT_MS:-45000}
    networks:
      - search-net
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ${MCP_METRICS_DATA_DIR:-./data}/container-runs:/mcp-run-state
    post_start:
      - command: >
          /bin/sh -c 'run_id="$$(cat /proc/sys/kernel/random/uuid)";
          started_at="$$(date -u +%Y-%m-%dT%H:%M:%SZ)";
          tmp=/mcp-run-state/crawl4ai.json.tmp;
          printf "{\"service\":\"crawl4ai\",\"run_id\":\"%s\",\"started_at\":\"%s\"}\n" "$$run_id" "$$started_at" > "$$tmp";
          mv "$$tmp" /mcp-run-state/crawl4ai.json'

  # Our MCP Server (orchestrates SearXNG + Crawl4AI)
  # mcp-server:
  #   build: 
  #     context: .
  #     dockerfile: Dockerfile
  #   ports:
  #     - "3003:3003"
  #   environment:
  #     - SEARXNG_URL=http://searxng:8080
  #     - CRAWL4AI_URL=http://crawl4ai:8000
  #     - PROXY_URL=${PROXY_URL}
  #     - LOG_LEVEL=info
  #   depends_on:
  #     searxng:
  #       condition: service_healthy
  #     crawl4ai:
  #       condition: service_started
  #   networks:
  #     - search-net
  #   volumes:
  #     - ./logs:/app/logs
  #   restart: unless-stopped

volumes:
  redis_data:

networks:
  search-net:
    driver: bridge
